<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#061a35">
<title>Lajes Pré-Moldados — Custo Certo V2</title>
<style>
:root{--navy:#061a35;--navy2:#0b2b52;--blue:#1769aa;--green:#16834b;--red:#c62828;--yellow:#b77900;--bg:#f3f6fa;--card:#fff;--text:#152235;--muted:#66758a;--line:#dfe6ee;--shadow:0 8px 25px rgba(10,35,65,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:none;min-height:100vh}.sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;background:linear-gradient(180deg,var(--navy),#082442);color:#fff;padding:20px 14px;z-index:20}.brand{font-weight:800;font-size:18px;padding:8px 10px 20px}.brand small{display:block;font-size:11px;opacity:.7;margin-top:5px;font-weight:500}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#dce8f6;padding:11px 13px;border-radius:10px;margin:3px 0}.nav button:hover,.nav button.active{background:rgba(255,255,255,.11);color:#fff}.main{margin-left:250px;min-height:100vh}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;z-index:10}.top h1{font-size:20px;margin:0}.content{padding:24px;max-width:1450px;margin:auto}.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:18px}.metric{padding:17px}.metric .label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase}.metric .value{font-size:25px;font-weight:800;margin-top:7px}.metric .sub{font-size:12px;color:var(--muted);margin-top:4px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}.section-title h2{font-size:17px;margin:0}.btn{padding:10px 14px;border-radius:9px;font-weight:700;background:var(--navy);color:#fff}.btn.secondary{background:#eaf0f7;color:var(--navy)}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.yellow{background:#f5e7c2;color:#754f00}.btn.sm{padding:7px 10px;font-size:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #cfd9e5;border-radius:9px;padding:10px 11px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,105,170,.1)}.full{grid-column:1/-1}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:11px;text-transform:uppercase;color:var(--muted)}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}.ok{background:#def5e8;color:#11683c}.warn{background:#fff0c9;color:#7b5600}.bad{background:#fde2e2;color:#a31d1d}.info{background:#e2eefb;color:#12558e}.notice{padding:12px 14px;border-radius:10px;background:#edf5ff;border-left:4px solid var(--blue);font-size:13px;margin-bottom:14px}.calc{background:linear-gradient(135deg,#f8fbff,#fff);border:1px solid #dce8f5;border-radius:13px;padding:16px}.big{font-size:30px;font-weight:900}.green-text{color:var(--green)}.red-text{color:var(--red)}.yellow-text{color:var(--yellow)}.muted{color:var(--muted)}.hidden{display:none!important}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 20% 10%,#164c7e,#061a35 60%)}.login-card{width:min(430px,100%);background:#fff;border-radius:20px;padding:30px;box-shadow:0 25px 70px rgba(0,0,0,.25)}.login-logo{font-size:22px;font-weight:900;color:var(--navy);margin-bottom:4px}.login-sub{color:var(--muted);margin-bottom:25px;font-size:13px}.mobile-menu{display:none}.empty{padding:25px;text-align:center;color:var(--muted)}.calc-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.line{border-top:1px solid var(--line);margin:14px 0}.result-row{display:flex;justify-content:space-between;padding:7px 0;font-size:13px}.result-row.total{font-weight:900;font-size:16px}.danger-box{border:1px solid #f1bcbc;background:#fff5f5;padding:14px;border-radius:11px}.success-box{border:1px solid #b9e2ca;background:#f4fff8;padding:14px;border-radius:11px}.mini{font-size:11px}.toast{position:fixed;right:20px;bottom:20px;background:#152235;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:100;opacity:0;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:translateY(0)}@media(max-width:950px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.mobile-menu{display:block}.g4{grid-template-columns:repeat(2,1fr)}.g3,.calc-grid{grid-template-columns:1fr}.top{padding:0 15px}.content{padding:15px}}@media(max-width:600px){.g2,.g4,.form{grid-template-columns:1fr}.content{padding:12px}.top h1{font-size:16px}.card{padding:14px}}
</style>
</head>
<body>
<div id="loginScreen" class="login">
  <div class="login-card">
    <div class="login-logo"><img src="logo_lajes.png" alt="Lajes Pré-Moldados" style="width:58px;height:58px;object-fit:contain;vertical-align:middle;margin-right:10px"> PRÉ-MOLDADOS CUSTO CERTO</div>
    <div class="login-sub">Conheça seu custo real. Venda com lucro.</div>
    <div class="field"><label>Senha</label><input id="loginPass" type="password" placeholder="Senha administrativa"></div>
    <button class="btn" style="width:100%;margin-top:14px" onclick="login()">Entrar</button>
    <p class="mini muted" style="margin-top:14px">Primeiro acesso: <b>admin123</b>. Altere a senha em Configurações.</p>
  </div>
</div>

<div id="app" class="app">
<aside id="sidebar" class="sidebar">
  <div class="brand"><img src="logo_lajes.png" alt="Logo" style="width:42px;height:42px;object-fit:contain;vertical-align:middle;margin-right:8px">PRÉ-MOLDADOS<br>CUSTO CERTO<small>Gestão de custos, produção e precificação</small></div>
  <nav class="nav">
    <button data-page="dashboard">📊 Dashboard</button>
    <button data-page="products">🏗️ Produtos</button>
    <button data-page="materials">🧱 Materiais</button>
    <button data-page="costs">🏭 Custos da Fábrica</button>
    <button data-page="production">⚙️ Produção</button>
    <button data-page="pricing">💰 Precificação</button>
    <button data-page="simulator">🎯 Simulador de Venda</button>
    <button data-page="goals">📈 Metas</button>
    <button data-page="backup">💾 Backup</button>
    <button data-page="settings">⚙️ Configurações</button>
  </nav>
</aside>

<main class="main">
<header class="top"><div class="row"><button class="btn secondary mobile-menu" onclick="toggleMenu()">☰</button><h1 id="pageTitle">Dashboard</h1></div><button class="btn secondary sm" onclick="logout()">Sair</button></header>
<div id="content" class="content"></div>
</main>
</div>
<div id="toast" class="toast"></div>

<script>
const KEY='pm_custo_certo_v1';
const BRL=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0);
const num=v=>{let n=parseFloat(String(v??'').replace(',','.'));return Number.isFinite(n)?n:0};
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const initial={
 settings:{company:'Lajes Pré-Moldados',hoursWeek:44,defaultLoss:5,defaultMargin:20,monthlyWeeks:4.33,password:'admin123'},
 materials:[
  {id:'cement',name:'Cimento CP V 40 kg',unit:'saco',price:42},
  {id:'sand',name:'Areia',unit:'m³',price:100},
  {id:'gravel',name:'Brita',unit:'m³',price:190},
  {id:'truss',name:'Treliça 12 m',unit:'barra',price:59.75},
  {id:'release',name:'Óleo desmoldante',unit:'litro',price:2}
 ],
 products:[{
  id:'trilho',name:'Trilho Treliçado',category:'Trilhos',unit:'m',yieldQty:47,timeHours:1.5,loss:5,
  components:[
   {material:'cement',qty:1,mode:'fixed'},
   {material:'sand',qty:9,mode:'liters18'},
   {material:'gravel',qty:5,mode:'liters18'},
   {material:'truss',qty:47,mode:'trussMeters'},
   {material:'release',qty:1,mode:'fixed'}
  ]
 }],
 costs:{energy:250,water:100,rent:300,maintenance:200,fuel:100,other:0,freightDefault:300},
 labor:[{id:'l1',name:'Colaborador 1',weekly:500},{id:'l2',name:'Colaborador 2',weekly:300}],
 production:[], simulations:[]
};
let db=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){return structuredClone(initial)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function login(){const p=document.getElementById('loginPass').value;if(p===db.settings.password){sessionStorage.setItem('pm_auth','1');showApp()}else toast('Senha incorreta.')}
function logout(){sessionStorage.removeItem('pm_auth');document.getElementById('app').style.display='none';document.getElementById('loginScreen').style.display='flex'}
function showApp(){document.getElementById('loginScreen').style.display='none';document.getElementById('app').style.display='block';go('dashboard')}
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open')}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
function go(page){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('sidebar').classList.remove('open');const titles={dashboard:'Dashboard',products:'Produtos',materials:'Materiais',costs:'Custos da Fábrica',production:'Produção',pricing:'Precificação',simulator:'Simulador de Venda',goals:'Metas',backup:'Backup',settings:'Configurações'};document.getElementById('pageTitle').textContent=titles[page];const f={dashboard:dashboard,products:products,materials:materials,costs:costs,production:production,pricing:pricing,simulator:simulator,goals:goals,backup:backup,settings:settings}[page];document.getElementById('content').innerHTML=f();if(page==='pricing')calcPricing();if(page==='simulator')calcSim();if(page==='goals')calcGoal()}
function materialCost(c){const m=db.materials.find(x=>x.id===c.material);if(!m)return 0;let q=num(c.qty);if(c.mode==='liters18')q=q*18/1000;else if(c.mode==='trussMeters')q=q/12;return q*m.price}
function productCalc(p,overrideTime=null){const loss=num(p.loss??db.settings.defaultLoss)/100;const materialBase=p.components.reduce((a,c)=>a+materialCost(c),0);const material=materialBase*(1+loss);const laborWeek=db.labor.reduce((a,x)=>a+num(x.weekly),0);const laborHour=laborWeek/num(db.settings.hoursWeek||44);const time=overrideTime===null?num(p.timeHours):num(overrideTime);const labor=time*laborHour;const indirectMonth=num(db.costs.energy)+num(db.costs.water)+num(db.costs.rent)+num(db.costs.maintenance)+num(db.costs.fuel)+num(db.costs.other);const hoursMonth=num(db.settings.hoursWeek)*num(db.settings.monthlyWeeks||4.33);const indirectHour=hoursMonth?indirectMonth/hoursMonth:0;const indirect=time*indirectHour;const industrial=material+labor+indirect;const qty=num(p.yieldQty)||1;return {materialBase,lossValue:materialBase*loss,material,labor,laborHour,indirect,indirectHour,industrial,perUnit:industrial/qty,time,qty,indirectMonth}}
function dashboard(){const trilho=db.products.find(p=>p.id==='trilho')||db.products[0];const c=trilho?productCalc(trilho):{perUnit:0,industrial:0,material:0};const month=new Date().toISOString().slice(0,7);const prod=db.production.filter(x=>x.date?.slice(0,7)===month);const qty=prod.reduce((a,x)=>a+num(x.qty),0);const cost=prod.reduce((a,x)=>a+num(x.cost),0);const fixed=num(db.costs.energy)+num(db.costs.water)+num(db.costs.rent)+num(db.costs.maintenance)+num(db.costs.fuel)+num(db.costs.other);return `<div class="grid g4"><div class="card metric"><div class="label">Custo do trilho</div><div class="value">${BRL(c.perUnit)}</div><div class="sub">por ${trilho?.unit||'unidade'}</div></div><div class="card metric"><div class="label">Material + perdas</div><div class="value">${BRL(c.material/trilho?.yieldQty||0)}</div><div class="sub">por unidade de rendimento</div></div><div class="card metric"><div class="label">Custos indiretos</div><div class="value">${BRL(fixed)}</div><div class="sub">mensais configurados</div></div><div class="card metric"><div class="label">Produção no mês</div><div class="value">${qty.toLocaleString('pt-BR')}</div><div class="sub">unidades registradas</div></div></div>
<div class="grid g2" style="margin-top:16px"><div class="card"><div class="section-title"><h2>📌 Custo de referência do Trilho</h2><button class="btn sm" onclick="go('pricing')">Precificar</button></div>${memory(trilho,c)}</div><div class="card"><div class="section-title"><h2>Como o sistema trabalha</h2></div><div class="notice">O custo industrial é separado do frete e de outros custos da venda. A mão de obra e os custos indiretos são rateados pelo tempo de produção. Esta V2 mantém os dados-base reais da operação: cimento a R$ 42, areia a R$ 100/m³, brita a R$ 190/m³, treliça de 12 m a R$ 59,75, óleo a R$ 2/L, rendimento de 47 m, perdas de 5% e equipe de R$ 800/semana.</div><p class="muted">Atenção: os R$ 6,62/m e R$ 6,95/m são o custo de materiais direto e com perda, respectivamente. O custo industrial completo depende do tempo de produção e do rateio configurado.</p><div class="row"><button class="btn secondary" onclick="go('materials')">Editar materiais</button><button class="btn secondary" onclick="go('costs')">Editar custos</button></div></div></div>`}
function memory(p,c){if(!p)return '<div class="empty">Cadastre um produto.</div>';return `<div class="result-row"><span>Rendimento</span><b>${num(p.yieldQty)} ${p.unit}</b></div><div class="result-row"><span>Material antes da perda</span><b>${BRL(c.materialBase)}</b></div><div class="result-row"><span>Perdas (${num(p.loss)}%)</span><b>${BRL(c.lossValue)}</b></div><div class="result-row"><span>Material após perda</span><b>${BRL(c.material)}</b></div><div class="result-row"><span>Mão de obra do lote</span><b>${BRL(c.labor)}</b></div><div class="result-row"><span>Custos indiretos do lote</span><b>${BRL(c.indirect)}</b></div><div class="line"></div><div class="result-row total"><span>Custo industrial do lote</span><b>${BRL(c.industrial)}</b></div><div class="result-row total"><span>Custo industrial por ${p.unit}</span><b>${BRL(c.perUnit)}</b></div>`}
function products(){return `<div class="card"><div class="section-title"><h2>Produtos cadastrados</h2><button class="btn" onclick="productForm()">+ Novo produto</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Produto</th><th>Categoria</th><th>Unidade</th><th>Rendimento</th><th>Tempo</th><th>Custo</th><th>Ações</th></tr></thead><tbody>${db.products.map(p=>{const c=productCalc(p);return `<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.category)}</td><td>${p.unit}</td><td>${p.yieldQty}</td><td>${p.timeHours} h</td><td><b>${BRL(c.perUnit)}</b></td><td><button class="btn secondary sm" onclick="productForm('${p.id}')">Editar</button> <button class="btn red sm" onclick="delProduct('${p.id}')">Excluir</button></td></tr>`}).join('')}</tbody></table></div></div>`}
function productForm(pid=null){const p=pid?db.products.find(x=>x.id===pid):{id:id(),name:'',category:'Trilhos',unit:'m',yieldQty:1,timeHours:1,loss:db.settings.defaultLoss,components:[]};document.getElementById('content').innerHTML=`<div class="card"><div class="section-title"><h2>${pid?'Editar':'Novo'} produto</h2><button class="btn secondary" onclick="go('products')">Voltar</button></div><div class="form"><div class="field"><label>Nome</label><input id="pn" value="${esc(p.name)}"></div><div class="field"><label>Categoria</label><select id="pc">${['Trilhos','Estacas','Manilhas','Lajotas','Pingadeiras','Blocos','Outros'].map(x=>`<option ${x===p.category?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Unidade de venda</label><input id="pu" value="${esc(p.unit)}"></div><div class="field"><label>Rendimento do lote</label><input id="py" type="number" step="0.001" value="${p.yieldQty}"></div><div class="field"><label>Tempo de produção do lote (horas)</label><input id="pt" type="number" step="0.01" value="${p.timeHours}"></div><div class="field"><label>Perda de materiais (%)</label><input id="pl" type="number" step="0.01" value="${p.loss}"></div></div><div class="line"></div><div class="section-title"><h2>Composição</h2><button class="btn secondary sm" onclick="addComp()">+ Material</button></div><div id="comps"></div><div class="row" style="margin-top:16px"><button class="btn green" onclick="saveProduct('${p.id}')">Salvar produto</button><button class="btn secondary" onclick="go('products')">Cancelar</button></div></div>`;window.editingComps=structuredClone(p.components);renderComps()}
function addComp(){window.editingComps.push({material:db.materials[0]?.id||'',qty:1,mode:'fixed'});renderComps()}
function renderComps(){const el=document.getElementById('comps');if(!el)return;el.innerHTML=window.editingComps.map((c,i)=>`<div class="row" style="margin:7px 0"><select onchange="editingComps[${i}].material=this.value">${db.materials.map(m=>`<option value="${m.id}" ${m.id===c.material?'selected':''}>${esc(m.name)}</option>`).join('')}</select><input style="width:120px" type="number" step="0.001" value="${c.qty}" onchange="editingComps[${i}].qty=this.value"><select onchange="editingComps[${i}].mode=this.value"><option value="fixed" ${c.mode==='fixed'?'selected':''}>Quantidade direta</option><option value="liters18" ${c.mode==='liters18'?'selected':''}>Latas de 18 L</option><option value="trussMeters" ${c.mode==='trussMeters'?'selected':''}>Metros de treliça / barra 12m</option></select><button class="btn red sm" onclick="editingComps.splice(${i},1);renderComps()">×</button></div>`).join('')||'<div class="empty">Nenhum material.</div>'}
function saveProduct(pid){const p=db.products.find(x=>x.id===pid)||{id:pid};Object.assign(p,{name:document.getElementById('pn').value.trim(),category:document.getElementById('pc').value,unit:document.getElementById('pu').value.trim()||'un',yieldQty:num(document.getElementById('py').value),timeHours:num(document.getElementById('pt').value),loss:num(document.getElementById('pl').value),components:structuredClone(window.editingComps)});if(!db.products.includes(p))db.products.push(p);save();toast('Produto salvo.');go('products')}
function delProduct(pid){if(confirm('Excluir este produto?')){db.products=db.products.filter(x=>x.id!==pid);save();go('products')}}
function materials(){return `<div class="card"><div class="section-title"><h2>Materiais e preços</h2><button class="btn" onclick="materialForm()">+ Novo material</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Material</th><th>Unidade</th><th>Preço</th><th>Ações</th></tr></thead><tbody>${db.materials.map(m=>`<tr><td>${esc(m.name)}</td><td>${m.unit}</td><td><b>${BRL(m.price)}</b></td><td><button class="btn secondary sm" onclick="materialForm('${m.id}')">Editar</button> <button class="btn red sm" onclick="delMaterial('${m.id}')">Excluir</button></td></tr>`).join('')}</tbody></table></div></div>`}
function materialForm(mid=null){const m=mid?db.materials.find(x=>x.id===mid):{id:id(),name:'',unit:'un',price:0};document.getElementById('content').innerHTML=`<div class="card"><div class="section-title"><h2>${mid?'Editar':'Novo'} material</h2><button class="btn secondary" onclick="go('materials')">Voltar</button></div><div class="form"><div class="field"><label>Nome</label><input id="mn" value="${esc(m.name)}"></div><div class="field"><label>Unidade de compra</label><input id="mu" value="${esc(m.unit)}"></div><div class="field"><label>Preço de compra</label><input id="mp" type="number" step="0.001" value="${m.price}"></div></div><div class="row" style="margin-top:16px"><button class="btn green" onclick="saveMaterial('${m.id}')">Salvar</button><button class="btn secondary" onclick="go('materials')">Cancelar</button></div></div>`}
function saveMaterial(mid){const m=db.materials.find(x=>x.id===mid)||{id:mid};Object.assign(m,{name:document.getElementById('mn').value.trim(),unit:document.getElementById('mu').value.trim()||'un',price:num(document.getElementById('mp').value)});if(!db.materials.includes(m))db.materials.push(m);save();toast('Material salvo.');go('materials')}
function delMaterial(mid){if(db.products.some(p=>p.components.some(c=>c.material===mid))){alert('Este material está usado em um produto. Remova-o da composição antes de excluir.');return}if(confirm('Excluir material?')){db.materials=db.materials.filter(x=>x.id!==mid);save();go('materials')}}
function costs(){const c=db.costs;const lab=db.labor.reduce((a,x)=>a+x.weekly,0);return `<div class="grid g2"><div class="card"><div class="section-title"><h2>Custos mensais da fábrica</h2></div><div class="form">${[['energy','Energia'],['water','Água'],['rent','Aluguel/local'],['maintenance','Manutenção'],['fuel','Combustível'],['other','Outros custos industriais']].map(([k,l])=>`<div class="field"><label>${l} (R$/mês)</label><input id="c_${k}" type="number" step=".01" value="${c[k]}"></div>`).join('')}</div><div class="row" style="margin-top:16px"><button class="btn green" onclick="saveCosts()">Salvar custos</button></div><div class="line"></div><div class="notice">Frete não entra automaticamente no custo industrial. Ele será informado por pedido no simulador.</div></div><div class="card"><div class="section-title"><h2>Mão de obra</h2></div><div class="table-wrap"><table class="table"><thead><tr><th>Colaborador</th><th>Semanal</th><th>Ações</th></tr></thead><tbody>${db.labor.map(x=>`<tr><td>${esc(x.name)}</td><td>${BRL(x.weekly)}</td><td><button class="btn secondary sm" onclick="editLabor('${x.id}')">Editar</button></td></tr>`).join('')}</tbody></table></div><div class="form" style="margin-top:12px"><div class="field"><label>Horas semanais produtivas</label><input id="hoursWeek" type="number" step=".5" value="${db.settings.hoursWeek}"></div><div class="field"><label>Semanas/mês para cálculo</label><input id="weeksMonth" type="number" step=".01" value="${db.settings.monthlyWeeks}"></div></div><div class="row" style="margin-top:12px"><button class="btn green" onclick="saveLaborSettings()">Salvar mão de obra</button></div><div class="line"></div><div class="calc"><div class="label muted">Custo da equipe por hora</div><div class="big">${BRL(lab/db.settings.hoursWeek)}</div><div class="muted mini">${BRL(lab)} por semana ÷ ${db.settings.hoursWeek} h</div></div></div></div>`}
function saveCosts(){['energy','water','rent','maintenance','fuel','other'].forEach(k=>db.costs[k]=num(document.getElementById('c_'+k).value));save();toast('Custos atualizados.');go('costs')}
function editLabor(lid){const l=db.labor.find(x=>x.id===lid);const v=prompt('Valor semanal de '+l.name,l.weekly);if(v!==null){l.weekly=num(v);save();go('costs')}}
function saveLaborSettings(){db.settings.hoursWeek=num(document.getElementById('hoursWeek').value)||44;db.settings.monthlyWeeks=num(document.getElementById('weeksMonth').value)||4.33;save();toast('Configuração salva.');go('costs')}
function production(){return `<div class="card"><div class="section-title"><h2>Registro de produção</h2><button class="btn" onclick="prodForm()">+ Registrar produção</button></div><div class="notice">O registro de produção usa o custo calculado no momento do lançamento e guarda a memória do lote. Isso permite acompanhar o custo histórico.</div><div class="table-wrap"><table class="table"><thead><tr><th>Data</th><th>Produto</th><th>Quantidade</th><th>Tempo</th><th>Custo do lote</th><th>Custo/un</th><th>Ações</th></tr></thead><tbody>${db.production.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${esc(x.productName)}</td><td>${x.qty}</td><td>${x.time} h</td><td>${BRL(x.cost)}</td><td>${BRL(x.cost/Math.max(1,x.qty))}</td><td><button class="btn red sm" onclick="delProd('${x.id}')">Excluir</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Nenhuma produção registrada.</td></tr>'}</tbody></table></div></div>`}
function prodForm(){document.getElementById('content').innerHTML=`<div class="card"><div class="section-title"><h2>Registrar produção</h2><button class="btn secondary" onclick="go('production')">Voltar</button></div><div class="form"><div class="field"><label>Produto</label><select id="prp">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Data</label><input id="prd" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Quantidade produzida</label><input id="prq" type="number" step=".001" value="47"></div><div class="field"><label>Tempo gasto (horas)</label><input id="prt" type="number" step=".01" value="1.5"></div><div class="field full"><label>Observações</label><textarea id="pro"></textarea></div></div><div class="row" style="margin-top:16px"><button class="btn green" onclick="saveProd()">Registrar</button></div></div>`}
function saveProd(){const p=db.products.find(x=>x.id===document.getElementById('prp').value),q=num(document.getElementById('prq').value),t=num(document.getElementById('prt').value);const c=productCalc(p,t);db.production.push({id:id(),date:document.getElementById('prd').value,productId:p.id,productName:p.name,qty:q,time:t,cost:(c.perUnit*q),note:document.getElementById('pro').value});save();toast('Produção registrada.');go('production')}
function delProd(pid){db.production=db.production.filter(x=>x.id!==pid);save();go('production')}
function pricing(){return `<div class="calc-grid"><div class="card"><div class="section-title"><h2>Precificação</h2></div><div class="form"><div class="field"><label>Produto</label><select id="priceProduct" onchange="calcPricing()">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Margem desejada (%)</label><input id="priceMargin" type="number" step=".01" value="${db.settings.defaultMargin}" oninput="calcPricing()"></div><div class="field"><label>Quantidade do pedido (opcional)</label><input id="priceQty" type="number" step=".001" value="500" oninput="calcPricing()"></div></div><div id="pricingResult" style="margin-top:16px"></div></div><div class="card"><h2 style="font-size:17px">Memória de cálculo</h2><div id="pricingMemory"></div></div></div>`}
function calcPricing(){const p=document.getElementById('priceProduct')?db.products.find(x=>x.id===document.getElementById('priceProduct').value):db.products[0];if(!p)return;const c=productCalc(p);const m=num(document.getElementById('priceMargin')?.value||db.settings.defaultMargin)/100;const price=m<1?c.perUnit/(1-m):Infinity;const q=num(document.getElementById('priceQty')?.value||1);const el=document.getElementById('pricingResult');if(el)el.innerHTML=`<div class="calc"><div class="muted">Custo industrial por ${p.unit}</div><div class="big">${BRL(c.perUnit)}</div><div class="line"></div><div class="result-row"><span>Margem desejada</span><b>${(m*100).toFixed(2)}%</b></div><div class="result-row total"><span>Preço sugerido</span><b class="green-text">${BRL(price)}</b></div><div class="result-row"><span>Receita para ${q} ${p.unit}</span><b>${BRL(price*q)}</b></div><div class="result-row"><span>Lucro estimado</span><b>${BRL((price-c.perUnit)*q)}</b></div></div>`;const mem=document.getElementById('pricingMemory');if(mem)mem.innerHTML=memory(p,c)}
function simulator(){return `<div class="calc-grid"><div class="card"><div class="section-title"><h2>Simulador de venda</h2></div><div class="form"><div class="field"><label>Produto</label><select id="simProduct" onchange="calcSim()">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Quantidade</label><input id="simQty" type="number" step=".001" value="500" oninput="calcSim()"></div><div class="field"><label>Preço de venda por unidade</label><input id="simPrice" type="number" step=".01" value="13" oninput="calcSim()"></div><div class="field"><label>Frete do pedido</label><input id="simFreight" type="number" step=".01" value="0" oninput="calcSim()"></div><div class="field"><label>Outros custos da venda</label><input id="simOther" type="number" step=".01" value="0" oninput="calcSim()"></div></div><div id="simResult" style="margin-top:16px"></div></div><div class="card"><div class="section-title"><h2>Testar preços</h2></div><div class="notice">Informe quantidade e o sistema compara preços automaticamente.</div><div id="priceTable"></div></div></div>`}
function calcSim(){const p=document.getElementById('simProduct')?db.products.find(x=>x.id===document.getElementById('simProduct').value):db.products[0];if(!p)return;const c=productCalc(p),q=num(document.getElementById('simQty')?.value||500),price=num(document.getElementById('simPrice')?.value||0),freight=num(document.getElementById('simFreight')?.value||0),other=num(document.getElementById('simOther')?.value||0);const industrial=c.perUnit*q,total=industrial+freight+other,revenue=price*q,profit=revenue-total,margin=revenue?profit/revenue*100:0;const cls=profit<0?'danger-box':'success-box';document.getElementById('simResult').innerHTML=`<div class="${cls}"><div class="result-row"><span>Receita</span><b>${BRL(revenue)}</b></div><div class="result-row"><span>Custo industrial</span><b>${BRL(industrial)}</b></div><div class="result-row"><span>Frete + outros</span><b>${BRL(freight+other)}</b></div><div class="line"></div><div class="result-row total"><span>${profit<0?'PREJUÍZO':'LUCRO'}</span><b class="${profit<0?'red-text':'green-text'}">${BRL(profit)}</b></div><div class="result-row"><span>Margem real</span><b>${margin.toFixed(2)}%</b></div></div>`;const min=c.perUnit+(freight+other)/Math.max(1,q);const prices=[10,11,12,13,14,15];document.getElementById('priceTable').innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Preço</th><th>Receita</th><th>Resultado</th><th>Margem</th></tr></thead><tbody>${prices.map(v=>{const pr=v*q;const lu=pr-total;const ma=pr?lu/pr*100:0;return `<tr><td><b>${BRL(v)}</b></td><td>${BRL(pr)}</td><td class="${lu<0?'red-text':'green-text'}"><b>${BRL(lu)}</b></td><td>${ma.toFixed(1)}%</td></tr>`}).join('')}</tbody></table></div><div class="notice" style="margin-top:12px">Preço mínimo para não perder dinheiro neste pedido: <b>${BRL(min)}/${p.unit}</b>.</div>`}
function goals(){return `<div class="card"><div class="section-title"><h2>Meta de faturamento</h2></div><div class="form"><div class="field"><label>Custos fixos mensais</label><input id="gFixed" type="number" step=".01" value="${monthlyFixed()} " oninput="calcGoal()"></div><div class="field"><label>Lucro desejado</label><input id="gProfit" type="number" step=".01" value="3000" oninput="calcGoal()"></div><div class="field"><label>Margem média esperada (%)</label><input id="gMargin" type="number" step=".01" value="${db.settings.defaultMargin}" oninput="calcGoal()"></div><div class="field"><label>Produto para converter em quantidade</label><select id="gProduct" onchange="calcGoal()">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div></div><div id="goalResult" style="margin-top:18px"></div></div>`}
function monthlyFixed(){return num(db.costs.energy)+num(db.costs.water)+num(db.costs.rent)+num(db.costs.maintenance)+num(db.costs.fuel)+num(db.costs.other)+db.labor.reduce((a,x)=>a+x.weekly,0)*num(db.settings.monthlyWeeks)}
function calcGoal(){const fixed=num(document.getElementById('gFixed')?.value||monthlyFixed()),profit=num(document.getElementById('gProfit')?.value||3000),margin=num(document.getElementById('gMargin')?.value||20)/100,qprod=document.getElementById('gProduct')?db.products.find(x=>x.id===document.getElementById('gProduct').value):db.products[0];const fatur=margin>0?(fixed+profit)/margin:0;const c=qprod?productCalc(qprod).perUnit:0;const qty=c?fatur/(c/(1-margin)):0;document.getElementById('goalResult').innerHTML=`<div class="grid g3"><div class="calc"><div class="muted">Faturamento necessário</div><div class="big">${BRL(fatur)}</div></div><div class="calc"><div class="muted">Meta semanal</div><div class="big">${BRL(fatur/4.33)}</div></div><div class="calc"><div class="muted">Meta diária (6 dias)</div><div class="big">${BRL(fatur/(4.33*6))}</div></div></div><div class="notice" style="margin-top:14px">Conversão aproximada para <b>${esc(qprod?.name||'produto')}</b>: ${qty.toLocaleString('pt-BR',{maximumFractionDigits:2})} ${qprod?.unit||'unidades'} por mês, usando o preço calculado com a margem informada.</div>`}
function backup(){return `<div class="grid g2"><div class="card"><h2 style="font-size:17px">Backup</h2><p class="muted">Exporte todos os dados para um arquivo JSON. Guarde esse arquivo em local seguro.</p><button class="btn" onclick="exportData()">⬇ Exportar backup</button></div><div class="card"><h2 style="font-size:17px">Restaurar</h2><p class="muted">Importe um backup criado por este sistema.</p><input type="file" id="importFile" accept=".json"><button class="btn secondary" style="margin-top:10px" onclick="importData()">Importar backup</button></div></div>`}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-custo-certo-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(){const f=document.getElementById('importFile').files[0];if(!f)return toast('Selecione um arquivo JSON.');const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.settings||!x.materials||!x.products)throw 0;db=x;save();toast('Backup restaurado.');go('dashboard')}catch(e){alert('Backup inválido.')}};r.readAsText(f)}
function settings(){return `<div class="grid g2"><div class="card"><h2 style="font-size:17px">Configurações gerais</h2><div class="form"><div class="field full"><label>Nome da empresa</label><input id="setCompany" value="${esc(db.settings.company)}"></div><div class="field"><label>Margem padrão (%)</label><input id="setMargin" type="number" step=".01" value="${db.settings.defaultMargin}"></div><div class="field"><label>Perda padrão (%)</label><input id="setLoss" type="number" step=".01" value="${db.settings.defaultLoss}"></div></div><button class="btn green" style="margin-top:15px" onclick="saveSettings()">Salvar configurações</button></div><div class="card"><h2 style="font-size:17px">Alterar senha</h2><div class="form"><div class="field"><label>Senha atual</label><input id="oldPass" type="password"></div><div class="field"><label>Nova senha</label><input id="newPass" type="password"></div></div><button class="btn" style="margin-top:15px" onclick="changePass()">Alterar senha</button><div class="notice" style="margin-top:15px">Esta V1 usa armazenamento local do navegador. Para uma operação multi-dispositivo com autenticação real e banco em nuvem, será necessário conectar o projeto a um backend/Supabase na etapa de publicação.</div></div></div>`}
function saveSettings(){db.settings.company=document.getElementById('setCompany').value.trim()||'Lajes Pré-Moldados';db.settings.defaultMargin=num(document.getElementById('setMargin').value);db.settings.defaultLoss=num(document.getElementById('setLoss').value);save();toast('Configurações salvas.');go('dashboard')}
function changePass(){if(document.getElementById('oldPass').value!==db.settings.password)return toast('Senha atual incorreta.');const n=document.getElementById('newPass').value;if(n.length<6)return toast('A nova senha deve ter pelo menos 6 caracteres.');db.settings.password=n;save();toast('Senha alterada.')}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement?.id==='loginPass')login()});
if(sessionStorage.getItem('pm_auth')==='1')showApp();
</script>
</body>
</html>
